extends:
  - recommended
rules:
  no-server-example.com: off
  security-defined: error
  operation-operationId-unique: error
  # OAuth authorization succeeds with a trusted 303 redirect. The authored
  # documentation checker enforces at least one 2xx or 3xx response instead.
  operation-2xx-response: off
  operation-summary: off
  operation-4xx-response: off
  tag-description: off
  info-license: off
